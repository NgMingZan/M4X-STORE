name: Deploy M4X STORE Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL không đúng định dạng"; exit 1 ;;
          esac

      - name: Test Supabase Auth endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE="$(curl -sS -o /tmp/m4x_supabase_health.txt -w "%{http_code}"             "$SUPABASE_URL/auth/v1/health"             -H "apikey: $SUPABASE_ANON_KEY")"

          echo "Supabase Auth health HTTP=$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SUPABASE_URL hoặc publishable/anon key không hợp lệ."
            cat /tmp/m4x_supabase_health.txt || true
            exit 1
          fi

          echo "Supabase connection OK"

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html admin.html _site/
          cp -r assets _site/assets

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          PUBLIC_URL="https://${OWNER_LOWER}.github.io/${REPO}/"

          cat > _site/config.js <<EOF2
          window.M4X_CONFIG = {
            SUPABASE_URL: "$SUPABASE_URL",
            SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY",
            PUBLIC_STORE_URL: "$PUBLIC_URL",
            BANK: {
              name: "VietinBank",
              account: "106885804727",
              holder: "NGUYEN MINH DAN",
              store: "M4X STORE"
            },
            ORDER_EXPIRE_MINUTES: 15,
            GITHUB_REPO: "$GITHUB_REPOSITORY"
          };
          EOF2

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
