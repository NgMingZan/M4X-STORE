name: Deploy Supabase V21 Theme Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/m4x-theme-service/**"
      - "supabase/functions/m4x-theme-paid-worker/**"
      - ".github/workflows/deploy-supabase-functions-v21.yml"

jobs:
  deploy-v21:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy m4x-theme-service
        run: |
          supabase functions deploy m4x-theme-service \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy m4x-theme-paid-worker
        run: |
          supabase functions deploy m4x-theme-paid-worker \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
