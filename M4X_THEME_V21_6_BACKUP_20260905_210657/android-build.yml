name: Build M4X STORE APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Phiên bản, ví dụ 2.0.0"
        required: true
        default: "2.0.0"
      version_code:
        description: "Version code, phải tăng dần"
        required: true
        default: "200"
      publish_release:
        description: "Xuất bản GitHub Release (cần keystore secrets)"
        type: boolean
        required: true
        default: false
      release_notes:
        description: "Ghi chú cập nhật"
        required: false
        default: "Cập nhật M4X STORE"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)

      - name: Prepare local storefront assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets/assets
          cp index.html admin.html android-app/app/src/main/assets/
          cp -r assets/* android-app/app/src/main/assets/assets/
          cat > android-app/app/src/main/assets/config.js <<EOF2
          window.M4X_CONFIG = {
            SUPABASE_URL: "$SUPABASE_URL",
            SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY",
            BANK: {
              name: "VietinBank",
              account: "106885804727",
              holder: "NGUYEN MINH DAN",
              store: "M4X STORE"
            },
            ORDER_EXPIRE_MINUTES: 15,
            APP_VERSION_NAME: "$VERSION_NAME",
            APP_VERSION_CODE: Number("$VERSION_CODE"),
            GITHUB_REPO: "NgMingZan/M4X-STORE"
          };
          EOF2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        if: ${{ inputs.publish_release }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASS" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASS" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 -d > android-app/m4x-release.jks

      - name: Build test APK
        if: ${{ !inputs.publish_release }}
        working-directory: android-app
        env:
          M4X_VERSION_NAME: ${{ inputs.version_name }}
          M4X_VERSION_CODE: ${{ inputs.version_code }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed release APK
        if: ${{ inputs.publish_release }}
        working-directory: android-app
        env:
          M4X_VERSION_NAME: ${{ inputs.version_name }}
          M4X_VERSION_CODE: ${{ inputs.version_code }}
          M4X_KEYSTORE_PATH: ${{ github.workspace }}/android-app/m4x-release.jks
          M4X_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          M4X_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          M4X_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename test APK
        if: ${{ !inputs.publish_release }}
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk M4X_STORE.apk

      - name: Rename signed APK
        if: ${{ inputs.publish_release }}
        run: cp android-app/app/build/outputs/apk/release/app-release.apk M4X_STORE.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M4X-STORE-${{ inputs.version_name }}
          path: M4X_STORE.apk
          if-no-files-found: error

      - name: Publish or update GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" M4X_STORE.apk --clobber
            gh release edit "$TAG" --title "M4X STORE $TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" M4X_STORE.apk --title "M4X STORE $TAG" --notes "$NOTES" --latest
          fi
