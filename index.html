<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>M4X STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
:root{--bg:#080a0f;--p:#12151d;--line:#262b38;--text:#f7f8fb;--muted:#9ba3b4;--ok:#6ee7b7;--bad:#ff9099}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -5%,#293057 0,transparent 32%),radial-gradient(circle at 90% 0,#3d234b 0,transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg),rgba(8,10,15,.75),transparent)}.brand{font-size:23px;font-weight:900}.brand span{opacity:.55}.btn{border:1px solid var(--line);border-radius:14px;background:#fff;color:#080a0f;padding:10px 14px;font-weight:800}.ghost{background:rgba(255,255,255,.07);color:#fff}.hero{padding:32px 4px 18px}.hero h1{font-size:clamp(38px,9vw,72px);line-height:.95;letter-spacing:-3px;margin:0 0 14px}.muted{color:var(--muted)}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.06);color:#fff}.cats{display:flex;gap:8px;overflow:auto;padding:14px 0}.cat{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#ddd;padding:9px 13px;border-radius:999px}.cat.active{background:#fff;color:#080a0f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border-radius:21px;overflow:hidden}.cover{aspect-ratio:1.25;background:#171b25 center/cover no-repeat;position:relative}.pill{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.58);padding:6px 9px;border-radius:999px;font-size:12px}.body{padding:12px}.name{font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:900}.stock{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:12px}.modal.open{display:flex}.sheet{width:min(650px,100%);max-height:94vh;overflow:auto;background:#11141c;border:1px solid var(--line);border-radius:28px;padding:20px}.close{float:right}.input{width:100%;background:#0c0f15;color:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:6px 0 10px}.tabs{display:flex;gap:8px;margin:10px 0}.bigbalance{font-size:34px;font-weight:950}.item{padding:12px;background:#0d1017;border:1px solid var(--line);border-radius:15px;margin:8px 0}.qr{width:min(350px,92%);background:#fff;border-radius:20px;padding:8px;display:block;margin:12px auto}.code{font-weight:900;background:rgba(255,255,255,.07);padding:12px;border-radius:14px;text-align:center}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:8px}.hero{padding-top:22px}.hero h1{letter-spacing:-2px}.body{padding:10px}.top .btn{padding:9px 10px}.name{font-size:14px}.price{font-size:14px}}
</style></head><body>
<div class="wrap"><header class="top"><div class="brand">M4X <span>STORE</span></div><button id="accountBtn" class="btn ghost" onclick="openAccount()">Tài khoản</button></header><section class="hero"><h1>Theme đẹp.<br>Tool chất. M4X.</h1><p class="muted">Mua một lần, tải lại bất cứ lúc nào ngay trong tài khoản của bạn.</p></section><input id="search" class="search" placeholder="Tìm sản phẩm..."><div id="cats" class="cats"></div><main id="grid" class="grid"></main></div>
<div id="modal" class="modal"><div class="sheet"><button class="btn ghost close" onclick="closeModal()">Đóng</button><div id="modalContent"></div></div></div>
<script>
const BASE=window.M4X_CONFIG||{};let SAVED={};try{SAVED=JSON.parse(localStorage.getItem('m4x_supabase_config')||'{}')}catch{}
const C={...BASE,SUPABASE_URL:SAVED.url||BASE.SUPABASE_URL||'',SUPABASE_ANON_KEY:SAVED.key||BASE.SUPABASE_ANON_KEY||''};
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);let products=[],categories=[],active='all',me=null,profile=null,poll=null,owned=new Map();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';
function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.add('open')}function closeModal(){if(poll)clearInterval(poll);$('modal').classList.remove('open')}
async function loadAuth(){const {data:{user}}=await sb.auth.getUser();me=user||null;if(me){const {data}=await sb.from('profiles').select('id,display_name,balance,role').eq('id',me.id).single();profile=data||null;$('accountBtn').textContent=`${profile?.display_name||'Tài khoản'} · ${money(profile?.balance||0)}`}else{$('accountBtn').textContent='Đăng nhập';profile=null}}
async function loadOwned(){owned.clear();if(!me)return;const {data,error}=await sb.from('orders').select('product_id,order_code,access_token,paid_at,products(delivery_type)').eq('status','paid').eq('user_id',me.id).order('paid_at',{ascending:false});if(error){console.warn('loadOwned:',error.message);return}(data||[]).forEach(o=>{if(o.product_id&&!owned.has(o.product_id))owned.set(o.product_id,o)})}
async function load(){await loadAuth();const [{data:c},{data:p}]=await Promise.all([sb.from('categories').select('*').eq('active',true).order('sort_order'),sb.from('products').select('*,categories(name)').eq('active',true).order('created_at',{ascending:false}),loadOwned()]);categories=c||[];products=p||[];renderCats();render()}
function renderCats(){$('cats').innerHTML=`<button class="cat active" data-id="all">Tất cả</button>`+categories.map(c=>`<button class="cat" data-id="${c.id}">${esc(c.icon||'')} ${esc(c.name)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));render()})}
function av(p){return p.stock_mode==='limited'?Math.max(0,(p.stock_limit||0)-(p.sold_count||0)-(p.reserved_count||0)):Infinity}
function render(){const q=$('search').value.toLowerCase().trim(),list=products.filter(p=>(active==='all'||String(p.category_id)===active)&&(!q||`${p.name} ${p.description||''}`.toLowerCase().includes(q)));$('grid').innerHTML=list.map(p=>{const own=owned.get(p.id),canDownload=!!own&&p.delivery_type==='download',label=canDownload?'Tải':(own?'Đã mua':'Mua');return `<article class="card" onclick="product('${p.id}')"><div class="cover" style="background-image:url('${esc(p.cover_url||'')}')"><span class="pill">${esc(p.categories?.name||'Sản phẩm')}</span>${own?'<span class="pill" style="left:auto;right:10px;background:rgba(20,120,90,.82)">✓ Đã sở hữu</span>':''}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="row"><div><div class="price">${money(p.price)}</div><div class="stock">${p.stock_mode==='limited'?'Còn '+av(p):'Không giới hạn'}</div></div><button class="btn" onclick="event.stopPropagation();ownedAction('${p.id}')">${label}</button></div></div></article>`}).join('')||'<div class="muted">Chưa có sản phẩm.</div>'}
async function ownedAction(id){const p=products.find(x=>x.id===id),o=owned.get(id);if(!p)return;if(o&&p.delivery_type==='download'){await getDownload(o.order_code,o.access_token);return}product(id)}
$('search').oninput=render;
function product(id){const p=products.find(x=>x.id===id);if(!p)return;const o=owned.get(id);if(o){openModal(`<h2>${esc(p.name)}</h2><p class="muted">${esc(p.description||'')}</p><div class="ok" style="font-size:20px;font-weight:900;margin:12px 0">✓ Bạn đã sở hữu sản phẩm này</div>${p.delivery_type==='download'?`<button class="btn" onclick="getDownload('${esc(o.order_code)}','${esc(o.access_token)}')">Tải sản phẩm</button>`:'<div class="muted">Sản phẩm đã được ghi nhận trong tài khoản của bạn.</div>'}<div id="dlmsg" class="muted" style="margin-top:10px"></div>`);return}openModal(`<h2>${esc(p.name)}</h2><p class="muted">${esc(p.description||'')}</p><div class="bigbalance">${money(p.price)}</div><p>${me?`Số dư của bạn: <b>${money(profile?.balance||0)}</b>`:'Đăng nhập để thanh toán bằng số dư.'}</p>${me?`<button class="btn" onclick="walletBuy('${p.id}')">Mua bằng số dư</button> <button class="btn ghost" onclick="openTopup()">Nạp tiền</button>`:`<button class="btn" onclick="authView('login')">Đăng nhập</button>`}`)}
function authView(mode='login'){openModal(`<h2>${mode==='register'?'Tạo tài khoản':'Đăng nhập'}</h2>${mode==='register'?'<input id="dn" class="input" placeholder="Tên hiển thị">':''}<input id="em" class="input" type="email" placeholder="Email"><input id="pw" class="input" type="password" placeholder="Mật khẩu"><button class="btn" onclick="${mode==='register'?'register()':'login()'}">${mode==='register'?'Đăng ký':'Đăng nhập'}</button><button class="btn ghost" onclick="authView('${mode==='register'?'login':'register'}')">${mode==='register'?'Đã có tài khoản':'Tạo tài khoản'}</button><div id="authmsg" class="muted" style="margin-top:10px"></div>`)}
async function register(){const {error}=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value,userOptions:{data:{display_name:$('dn').value.trim()}}});$('authmsg').textContent=error?error.message:'Đăng ký thành công. Nếu Supabase bật xác nhận email, hãy mở email xác nhận rồi đăng nhập.'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('authmsg').textContent=error.message;return}await loadAuth();await loadOwned();render();closeModal();openAccount()}
async function logout(){await sb.auth.signOut();me=profile=null;owned.clear();closeModal();await loadAuth();render()}
async function openAccount(){await loadAuth();if(!me){authView('login');return}const [{data:t},{data:o}]=await Promise.all([sb.from('wallet_transactions').select('*').order('created_at',{ascending:false}).limit(20),sb.from('orders').select('order_code,amount,paid_at,access_token,products(name,delivery_type)').eq('status','paid').order('created_at',{ascending:false}).limit(20)]);openModal(`<h2>${esc(profile?.display_name||me.email)}</h2><div class="muted">${esc(me.email)}</div><div class="bigbalance">${money(profile?.balance||0)}</div><div class="tabs"><button class="btn" onclick="openTopup()">+ Nạp tiền</button>${profile?.role==='admin'?'<button class="btn ghost" onclick="location.href=&quot;./admin.html&quot;">Quản trị</button>':''}<button class="btn ghost" onclick="logout()">Đăng xuất</button></div><h3>Sản phẩm đã mua</h3>${(o||[]).map(x=>`<div class="item"><div class="row"><div><b>${esc(x.products?.name||'Sản phẩm')}</b><div class="muted">${money(x.amount)} · ${new Date(x.paid_at).toLocaleString('vi-VN')}</div></div>${x.products?.delivery_type==='download'?`<button class="btn ghost" onclick="getDownload('${esc(x.order_code)}','${esc(x.access_token)}')">Tải lại</button>`:''}</div></div>`).join('')||'<div class="muted">Chưa có.</div>'}<h3>Lịch sử số dư</h3>${(t||[]).map(x=>`<div class="item row"><div>${esc(x.description||x.type)}<div class="muted">${new Date(x.created_at).toLocaleString('vi-VN')}</div></div><b class="${x.amount>=0?'ok':'bad'}">${x.amount>=0?'+':''}${money(x.amount)}</b></div>`).join('')||'<div class="muted">Chưa có giao dịch.</div>'}`)}
function openTopup(){if(!me){authView();return}openModal(`<h2>Nạp tiền vào M4X STORE</h2><p class="muted">Số dư chỉ dùng mua hàng trong M4X STORE, không rút/chuyển cho tài khoản khác.</p><div class="tabs"><button class="btn ghost" onclick="makeTopup(20000)">20K</button><button class="btn ghost" onclick="makeTopup(50000)">50K</button><button class="btn ghost" onclick="makeTopup(100000)">100K</button><button class="btn ghost" onclick="makeTopup(200000)">200K</button></div><input id="customTopup" class="input" type="number" min="10000" max="5000000" step="1000" placeholder="Hoặc nhập số tiền"><button class="btn" onclick="makeTopup(Number($('customTopup').value))">Tạo QR nạp tiền</button><div id="topmsg" class="muted" style="margin-top:10px"></div>`)}
async function makeTopup(amount){if(!amount||amount<10000){$('topmsg').textContent='Tối thiểu 10.000đ';return}const {data,error}=await sb.rpc('create_wallet_topup',{p_amount:amount});if(error){$('topmsg').textContent=error.message;return}showTopup(data)}
function showTopup(t){const desc=`SEVQR ${t.topup_code}`;const qr=`https://vietqr.app/img?acc=${encodeURIComponent(C.BANK.account)}&bank=${encodeURIComponent(C.BANK.name)}&amount=${t.amount}&des=${encodeURIComponent(desc)}&template=compact&showinfo=true&fullacc=true&holder=${encodeURIComponent(C.BANK.holder)}&store=${encodeURIComponent(C.BANK.store)}`;openModal(`<h2>Nạp ${money(t.amount)}</h2><img class="qr" src="${qr}"><div class="muted" style="text-align:center">${esc(C.BANK.name)} · ${esc(C.BANK.account)}<br>${esc(C.BANK.holder)}</div><div class="code">${esc(desc)}</div><p id="payState" class="muted" style="text-align:center">Đang chờ ngân hàng xác nhận...</p>`);poll=setInterval(async()=>{const {data}=await sb.from('topups').select('status').eq('topup_code',t.topup_code).single();if(data?.status==='paid'){clearInterval(poll);$('payState').innerHTML='<span class="ok">✓ Nạp tiền thành công</span>';await loadAuth();setTimeout(openAccount,800)}else if(data?.status==='review'||data?.status==='expired'){$('payState').innerHTML=`<span class="bad">${data.status==='review'?'Cần Admin kiểm tra':'Mã nạp đã hết hạn'}</span>`}},3000)}
async function walletBuy(id){const {data,error}=await sb.rpc('wallet_purchase',{p_product_id:id,p_quantity:1});if(error){const msg=String(error.message||'');if(msg.toLowerCase().includes('đã mua')){await loadOwned();render();openModal(`<h2>Đã sở hữu</h2><p class="muted">Bạn đã mua sản phẩm này. Hãy bấm Tải ở cửa hàng hoặc vào Tài khoản để tải lại.</p>`);return}openModal(`<h2>Không thể mua</h2><p class="bad">${esc(msg)}</p><button class="btn" onclick="openTopup()">Nạp tiền</button>`);return}await loadAuth();await loadOwned();render();openModal(`<h2 class="ok">✓ Mua thành công</h2><p>${esc(data.product_name)}</p><div class="bigbalance">${money(data.amount)}</div><p>Số dư còn lại: <b>${money(data.balance_after)}</b></p>${data.delivery_type==='download'?`<button class="btn" onclick="getDownload('${esc(data.order_code)}','${esc(data.access_token)}')">Tải sản phẩm</button>`:''}<div id="dlmsg" class="muted"></div>`)}
async function getDownload(code,token){try{const session=(await sb.auth.getSession()).data.session;const r=await fetch(`${C.SUPABASE_URL}/functions/v1/create-download-link`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_ANON_KEY,'Authorization':'Bearer '+(session?.access_token||C.SUPABASE_ANON_KEY)},body:JSON.stringify({order_code:code,access_token:token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Không tạo được link tải');location.href=d.url}catch(e){const box=$('dlmsg');if(box)box.textContent=e.message;else openModal(`<h2>Không thể tải</h2><p class="bad">${esc(e.message)}</p><p class="muted">Kiểm tra Edge Function create-download-link và file sản phẩm trong Storage.</p>`)}}
load();
</script></body></html>
